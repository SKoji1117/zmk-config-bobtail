# ビルド結果に関わるファイルが変わったときだけ走らせる（README や画像だけの変更では走らない）
on:
  push:
    paths:
      - "config/**"
      - "build.yaml"
      - "zephyr/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "config/**"
      - "build.yaml"
      - "zephyr/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # v0.3.0
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@edf5c0814fd3ea202e43aad2d68fd32e882a518c
